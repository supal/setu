services:
  - type: web
    name: sitetracker-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_MAX_AGE_DAYS
        value: "7"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Render's free web services have an ephemeral filesystem — local uploads
      # are wiped on every deploy/restart. Use Cloudflare R2 in production; the
      # frontend's VITE_UPLOAD_MODE must be set to "tus" to match.
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: site-photos
      - key: R2_PUBLIC_URL
        sync: false
