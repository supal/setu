services:
  postgres:
    image: postgres:16-alpine
    container_name: sitetracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitetracker
      POSTGRES_PASSWORD: sitetracker
      POSTGRES_DB: sitetracker
    ports:
      - "5433:5432"
    volumes:
      - sitetracker-postgres-data:/var/lib/postgresql/data

volumes:
  sitetracker-postgres-data:
